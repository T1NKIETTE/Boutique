<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T1NKIETTE — Nouvelles & Arrivages</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <style>
    .news-subbar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .time-gauge-bar {
      width: 100%;
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .time-gauge-fill {
      height: 100%;
      background: var(--accent-color);
    }
    .poll-option {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .poll-option:hover { border-color: var(--text-primary); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-left"><a href="index.html" class="logo">T1NKIETTE</a></div>
    <div class="header-center">
      <div class="search-bar-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="news-search" placeholder="Rechercher dans les nouvelles..." oninput="filterNews()">
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="openNewsFavoritesModal()">⭐ Favoris</button>
      <button class="icon-btn" onclick="window.location.href='cart.html'">🛒<span id="cart-badge" class="badge">0</span></button>
      <button class="btn-sommaire" onclick="openSommaireDrawer()">Sommaire ☰</button>
    </div>
  </header>

  <main class="container">
    <!-- 0.5 BARRE SECONDAIRE FIXE NOUVELLES -->
    <div class="news-subbar">
      <button class="subbar-btn" onclick="openNewsFavoritesModal()">⭐ Mes nouvelles favorites</button>
      <button class="subbar-btn" onclick="openModal('realtime-stocks-modal')">📊 Stocks en temps réel</button>
      <button class="subbar-btn" onclick="scrollToSection('arrivals-section')">🚀 Arrivages</button>
      <button class="subbar-btn" onclick="scrollToSection('polls-section')">📊 Sondages</button>
    </div>

    <!-- 0.5.5 FILTRES & TRIS NOUVELLES -->
    <div class="filter-toolbar">
      <select id="news-type-filter" onchange="filterNews()">
        <option value="all">Tous les types (Fonctionnement, Arrivages, Ruptures)</option>
        <option value="Fonctionnement">Fonctionnement</option>
        <option value="Arrivage">Arrivages</option>
        <option value="Rupture">Ruptures</option>
      </select>
      <select id="news-sort" onchange="filterNews()">
        <option value="recent">Tri : Plus récents</option>
        <option value="popular">Tri : Popularité (favoris)</option>
      </select>
    </div>

    <!-- 1. DERNIÈRES NOUVELLES (Gros encarts) -->
    <section class="home-section">
      <h2 class="section-title">📰 À la Une</h2>
      <div id="latest-news-container" style="display:flex; flex-direction:column; gap:16px;"></div>
    </section>

    <!-- 2. DOUBLE ENCART ARRIVAGES & SONDAGES -->
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px; margin-bottom:40px;">
      
      <!-- ARRIVAGES -->
      <section class="card" id="arrivals-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h3>🚀 Prochains Arrivages</h3>
          <span style="font-size:12px; color:var(--text-secondary);">Mise à jour live</span>
        </div>
        <div id="arrivals-container" style="display:flex; flex-direction:column; gap:14px;"></div>
      </section>

      <!-- SONDAGES -->
      <section class="card" id="polls-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h3>📊 Sondage en Vigueur</h3>
          <span style="font-size:12px; color:var(--success-color);">Actif</span>
        </div>
        <div id="active-poll-container"></div>
      </section>

    </div>

    <!-- 3. NOUVELLES PLUS ANCIENNES (Petits encarts + bouton plus) -->
    <section class="home-section" style="margin-bottom:40px;">
      <h2 class="section-title">📜 Archives & Actualités Précédentes</h2>
      <div id="older-news-container" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-bottom:20px;"></div>
      <div style="text-align:center;">
        <button class="btn btn-outline" id="load-more-news-btn" onclick="loadMoreNews()">Plus de nouvelles</button>
      </div>
    </section>

  </main>

  <!-- POP-UP NOUVELLES FAVORITES -->
  <div id="news-favorites-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h2>⭐ Mes Nouvelles Favorites</h2>
        <button class="close-btn" onclick="closeModal('news-favorites-modal')">✕</button>
      </div>
      <div id="news-favorites-list"></div>
    </div>
  </div>

  <!-- PANNEAU SOMMAIRE -->
  <div id="sommaire-drawer" class="drawer-backdrop">
    <div class="drawer-panel">
      <div class="drawer-header"><h2>Sommaire T1NKIETTE</h2><button class="close-btn" onclick="closeSommaireDrawer()">✕</button></div>
      <div class="drawer-links" id="drawer-links-container"></div>
    </div>
  </div>

  <nav class="app-footer">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Accueil</span></a>
    <a href="catalog.html" class="nav-item"><span class="nav-icon">📦</span><span>Catalogue</span></a>
    <a href="news.html" class="nav-item active"><span class="nav-icon">📰</span><span>Nouvelles</span></a>
    <a href="community.html" class="nav-item"><span class="nav-icon">👥</span><span>Communauté</span></a>
    <a href="account.html" class="nav-item"><span class="nav-icon">👤</span><span>Compte</span></a>
  </nav>

  <script src="js/store-data.js"></script>
  <script src="js/app-home.js"></script>
  <script src="js/app-news.js"></script>
</body>
</html>
